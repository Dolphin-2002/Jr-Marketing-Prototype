<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR Marketing &mdash; Forgot Password</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230a5c2e'/><text x='50%25' y='55%25' font-size='13' font-weight='900' fill='white' text-anchor='middle' dominant-baseline='middle' font-family='Arial'>JR</text></svg>">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/login.css">
    <style>
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: rgba(255,255,255,0.85);
            font-size: var(--font-size-sm);
            font-weight: 600;
            margin-bottom: var(--spacing-md);
            text-decoration: none;
            transition: color var(--transition-fast);
        }
        .back-link:hover { color: white; text-decoration: none; }
    </style>
</head>
<body>
    <main class="login-page">

        <a href="index.html" class="back-link">&#8592; Back to Login</a>

        <!-- Logo -->
        <div class="login-logo-area">
            <div class="login-logo-img">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="140" height="98">
                    <rect x="55" y="4" width="90" height="90" rx="8" ry="8"
                          fill="none" stroke="#1a1a2e" stroke-width="6"/>
                    <rect x="73" y="22" width="54" height="54" rx="5" ry="5"
                          fill="none" stroke="#e63946" stroke-width="5"/>
                    <text x="62" y="67" font-family="Arial" font-size="38"
                          font-weight="900" fill="#1a1a2e">p</text>
                    <text x="102" y="67" font-family="Arial" font-size="38"
                          font-weight="900" fill="#1a1a2e">b</text>
                    <rect x="123" y="4" width="22" height="22" rx="4" ry="4" fill="#e63946"/>
                    <text x="100" y="112" font-family="Arial" font-size="22"
                          font-weight="900" fill="#1a1a2e" text-anchor="middle" letter-spacing="3">JR-MARKETING</text>
                </svg>
            </div>
        </div>

        <!-- Card -->
        <div class="login-card">
            <div class="login-card-header">
                <h1 class="login-title">Reset Password</h1>
                <p class="login-subtitle">Enter your username to receive reset instructions</p>
            </div>

            <div id="fp-alert" class="alert" style="display:none;" role="alert"></div>

            <form id="forgot-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="fp-username">Username or Email</label>
                    <div class="input-icon-wrap">
                        <input type="text" id="fp-username" class="form-control"
                               placeholder="Enter your username" aria-required="true">
                        <span class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </span>
                    </div>
                    <span class="form-error-msg"></span>
                </div>

                <div class="login-btn-group">
                    <button type="submit" id="fp-btn" class="btn btn-primary">
                        <span class="btn-text">Send Reset Link</span>
                        <div class="spinner"></div>
                    </button>
                    <a href="index.html" class="btn btn-outline">Back to Login</a>
                </div>
            </form>
        </div>

        <footer class="login-footer">
            <p>JR Marketing &mdash; V6.3 &nbsp;|&nbsp; Copyright &copy; 2025 All rights reserved.</p>
        </footer>
    </main>

    <script src="assets/js/utils.js"></script>
    <script src="assets/js/toast.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form    = document.getElementById('forgot-form');
            const input   = document.getElementById('fp-username');
            const btn     = document.getElementById('fp-btn');
            const alertEl = document.getElementById('fp-alert');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const val = input.value.trim();
                if (!val) {
                    input.classList.add('is-error');
                    return;
                }
                btn.classList.add('loading');
                btn.disabled = true;
                alertEl.style.display = 'none';

                await new Promise(r => setTimeout(r, 1200));

                btn.classList.remove('loading');
                btn.disabled = false;

                alertEl.className = 'alert alert-success';
                alertEl.innerHTML = '<span class="alert-icon">✓</span><span>If this account exists, a reset link has been sent to your contact. Please contact your system administrator.</span>';
                alertEl.style.display = 'flex';

                Toast.success('Reset instructions sent!');
                input.value = '';
            });

            input.addEventListener('input', () => input.classList.remove('is-error'));
        });
    </script>
</body>
</html>
