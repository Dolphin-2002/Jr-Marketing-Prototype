<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PRO DATA - POS, ERP, Stock Management & Invoicing Application. Login to your account.">
    <meta name="author" content="NGT Lanka (Pvt) Ltd.">
    <meta name="theme-color" content="#0a5c2e">

    <title>PRO DATA &mdash; Login</title>

    <!-- Favicon SVG inline -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230a5c2e'/><text x='50%25' y='55%25' font-size='18' font-weight='900' fill='white' text-anchor='middle' dominant-baseline='middle' font-family='Arial'>P</text></svg>">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>

    <!-- LOGIN PAGE WRAPPER -->
    <main class="login-page" role="main" aria-label="Login Page">

        <!-- ===================== COMPONENT: Login Logo ===================== -->
        <div id="login-logo-placeholder">
            <div class="login-logo-area" role="banner">
                <div class="login-logo-img" aria-label="PRO DATA Logo">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="160" height="112">
                        <defs>
                            <filter id="glow">
                                <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                                <feMerge>
                                    <feMergeNode in="coloredBlur"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                        </defs>
                        <rect x="55" y="4" width="90" height="90" rx="8" ry="8"
                              fill="none" stroke="#1a1a2e" stroke-width="6"/>
                        <rect x="73" y="22" width="54" height="54" rx="5" ry="5"
                              fill="none" stroke="#e63946" stroke-width="5"/>
                        <text x="62" y="67" font-family="'Segoe UI',Arial,sans-serif"
                              font-size="38" font-weight="900" fill="#1a1a2e" filter="url(#glow)">p</text>
                        <text x="102" y="67" font-family="'Segoe UI',Arial,sans-serif"
                              font-size="38" font-weight="900" fill="#1a1a2e" filter="url(#glow)">b</text>
                        <rect x="123" y="4" width="22" height="22" rx="4" ry="4" fill="#e63946"/>
                        <text x="100" y="112" font-family="'Segoe UI',Arial,sans-serif"
                              font-size="22" font-weight="900" fill="#1a1a2e"
                              text-anchor="middle" letter-spacing="3">JR-MARKETING</text>
                    </svg>
                </div>
                <p class="login-logo-tagline">POS, ERP, Stock Management &amp; Invoicing Application</p>
                <p class="login-logo-url">www.jr-marketing.com</p>
            </div>
        </div>

        <!-- ===================== COMPONENT: Login Card ===================== -->
        <div class="login-card" role="region" aria-label="Login Form">

            <div class="login-card-header">
                <h1 class="login-title">Welcome Back</h1>
                <p class="login-subtitle">Login to your JR Marketing</p>
            </div>

            <!-- Alert Box (hidden by default) -->
            <div id="login-alert" class="alert" style="display:none;" role="alert" aria-live="polite"></div>

            <form id="login-form" novalidate autocomplete="off">

                <!-- Username Field -->
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <div class="input-icon-wrap">
                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control"
                            placeholder="Username"
                            autocomplete="username"
                            aria-required="true"
                            spellcheck="false"
                        >
                        <span class="input-icon" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </span>
                    </div>
                    <span class="form-error-msg" id="username-error"></span>
                </div>

                <!-- Forgot Password -->
                <div class="login-forgot-row">
                    <a href="forgot-password.html" class="login-forgot-link">Forgot Your Password?</a>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="password-wrap">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Password"
                            autocomplete="current-password"
                            aria-required="true"
                        >
                        <button type="button" class="password-toggle" id="toggle-password"
                                aria-label="Show password" title="Toggle password visibility">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <span class="form-error-msg" id="password-error"></span>
                </div>

                <!-- Remember Me -->
                <div class="login-remember-row">
                    <label class="checkbox-wrap">
                        <input type="checkbox" id="remember-me" name="remember-me">
                        <span class="checkbox-label">Remember Me</span>
                    </label>
                </div>

                <!-- Buttons -->
                <div class="login-btn-group">
                    <button type="submit" id="login-btn" class="btn btn-primary">
                        <span class="btn-text">Login</span>
                        <div class="spinner" aria-hidden="true"></div>
                    </button>
                    <button type="button" id="tech-team-btn" class="btn btn-success">
                        <span class="btn-text">Technical Team</span>
                    </button>
                </div>

            </form>
        </div>

        <!-- ===================== COMPONENT: Login Footer ===================== -->
        <footer id="login-footer-placeholder" class="login-footer" role="contentinfo">
            <p>PRO DATA &mdash; V6.3 &nbsp;|&nbsp; Copyright &copy; 2025 All rights reserved.</p>
            <p>Design and Developed by <a href="https://ngtlanka.com" target="_blank" rel="noopener noreferrer">NGT Lanka (Pvt) Ltd.</a></p>
        </footer>

    </main>

    <!-- JS Dependencies -->
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/toast.js"></script>
    <script src="assets/js/login.js"></script>
</body>
</html>
